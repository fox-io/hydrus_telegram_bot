name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: requests and urllib3 both declare Requires-Python >= 3.10.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ImageMagick and ffmpeg are deliberately not installed. The tests mock Wand and
      # never shell out to ffmpeg, so the suite runs without them. preflight_check.py is
      # not run here either, since it requires config/config.json, which is not committed.
      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned so a new ruff release cannot turn CI red without a deliberate bump.
      - name: Install ruff
        run: pip install ruff==0.16.8

      - name: Lint
        run: ruff check --output-format=github .
